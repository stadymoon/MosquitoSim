# Skin-observation experiment (11/24): stage 1 config unchanged, new build only.
# Stage 1: rooms (4x3, 5x4, L) with furniture set A, standing human.
# Random subgoals: APPROACH (random skin), HIDE (random hidden candidate),
# MOVE_TO (random candidate). Continues from stage 0:
#   scripts/run_stage.sh 1 <build> 1 2 3   (adds --initialize-from stage0_s<seed>)
behaviors:
  Mosquito:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false        # observations are already scaled to [-1, 1]
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 20000
    checkpoint_interval: 250000
    keep_checkpoints: 20

environment_parameters:
  stage: 1.0
  env_split: 0.0            # train
  planner: 1.0              # random training planner
  path_guide: 1.0           # MOVE_TO / HIDE follow an obstacle-free route (11/22)
  time_penalty: 0.005
  landing_radius: 0.02      # final values of the stage 0 curriculum
  landing_speed: 0.3
  feed_time: 3.0
  prev_stage_mix: 0.2       # 20% of episodes use the previous stage
